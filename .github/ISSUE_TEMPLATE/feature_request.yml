name: Feature request
description: Suggest a new feature or a change
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: "The problem you want to solve"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "The change you propose"
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives you considered"
  - type: dropdown
    id: pr
    attributes:
      label: "Are you willing to send a pull request?"
      options:
        - "Yes"
        - "Yes, with some guidance"
        - "No"
